<!DOCTYPE html>
<html>

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">
    <meta name="color-scheme" content="dark">

    <link rel="stylesheet" href="{{ url_for('static', filename='base.css') }}">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@4.6.2/dist/css/bootstrap.min.css">

    {% block header %}
    {% endblock %}
</head>

<body>
<header class="header-bar">
    <a href="/">Home</a>
    {% if session.get('authenticated') %}
        <a class="auth-indicator text-success font-weight-bold ml-auto" title="Authenticated" style="font-size: 1.2rem; line-height: 1;" href="/login">
        <span>✓</span>
        </a>
    {% else %}
        <a class="auth-indicator text-danger font-weight-bold ml-auto" title="Not Authenticated" style="font-size: 1.2rem; line-height: 1;" href="/login">
        <span>✗</span>
        </a>
    {% endif %}
</header>
<div id="content-block-div" class="h-100">
    {% block content %}
    {% endblock %}
</div>
{% include 'bottom.html' %}
</body>
</html>
